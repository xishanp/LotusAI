# Lotus AI —— 版本目录
#
# 构建工具链刻意对齐 NASclaw（openclaw Android）已验证可用的组合：
#   Gradle 9.7.1 / AGP 9.4.1 / Kotlin 2.4.20（AGP 内置 Kotlin，无需 kotlin-android 插件）
#   Compose BOM 2026.09.00 / compileSdk 37（AndroidX Core 1.19 与 Lifecycle 2.11 的要求）
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
androidx-activity = "1.13.0"
androidx-compose-bom = "2026.09.00"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.0"
coroutines = "1.11.0"
serialization-json = "1.11.0"
# 模糊底座：Chris Banes 的 haze。v2 把特效拆成独立模块 ——
# 核心 haze 只给基础设施，模糊在 haze-blur，材质预设（HazeMaterials）在 haze-blur-materials。
haze = "2.0.1"
# 折射玻璃：Kyant0 的 backdrop（Apache 2.0）。折射 lens / 色散 chromaticAberration /
# 模糊 / vibrancy / 高光 / 阴影都做齐。形状与圆角用同作者的 shapes。
backdrop = "2.0.1"
kyant-shapes = "1.2.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }

haze-core = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-blur = { module = "dev.chrisbanes.haze:haze-blur", version.ref = "haze" }
haze-blur-materials = { module = "dev.chrisbanes.haze:haze-blur-materials", version.ref = "haze" }
backdrop = { module = "io.github.kyant0:backdrop", version.ref = "backdrop" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyant-shapes" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
